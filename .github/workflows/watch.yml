name: watch

on:
  schedule:
    # Keeps a next job queued; it starts as soon as the running one ends. Every 15 min
    # because GitHub fires schedules late, and a gap over 10 min left no job queued.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # commit data/ and docs/
  actions: write   # disable this workflow once the search is over

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Europe/Berlin
      WATCH_DATA_DIR: data
      WATCH_STATUS_FILE: docs/index.html
      WATCH_PUBLIC: "1"
      WATCH_STATUS_URL: https://timkrause.github.io/bonn-termin-watcher/
      WATCH_STOP_HINT: gh workflow disable watch.yml -R timkrause/bonn-termin-watcher
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      CONTACT_FIRST_NAME: ${{ secrets.CONTACT_FIRST_NAME }}
      CONTACT_LAST_NAME: ${{ secrets.CONTACT_LAST_NAME }}
      CONTACT_MAIL: ${{ secrets.CONTACT_MAIL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: bash run_loop.sh
